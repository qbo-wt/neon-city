<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a5a"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#ff2a6d" stroke-width="2.5" opacity="0.85"/>
  <!-- cyan offset (chromatic split) -->
  <path d="M19 50 V14 L45 50 V14" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linejoin="miter" stroke-linecap="square" transform="translate(-2.5 1.5)" opacity="0.9"/>
  <!-- main neon N -->
  <path d="M19 50 V14 L45 50 V14" fill="none" stroke="#ff2a6d" stroke-width="8" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)"/>
  <path d="M19 50 V14 L45 50 V14" fill="none" stroke="#ffd1e0" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
  <rect x="48" y="44" width="7" height="7" fill="#f5e663"/>
</svg>
